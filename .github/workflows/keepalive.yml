name: 魔搭空间保活

# 每 6 小时自动访问清单里的所有链接，模拟浏览器打开触发冷启动保温。
# 只做 GET，绝不调用发布/部署接口。也可在 Actions 页面手动点 Run workflow 立即保活。
on:
  schedule:
    - cron: '0 */6 * * *'   # UTC 每6小时 = 北京时间 08:00 / 14:00 / 20:00 / 02:00
  workflow_dispatch:        # 手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库（读取 keepalive.json）
        uses: actions/checkout@v4

      - name: 保活巡检（并行 GET 所有链接）
        run: python3 scripts/keepalive.py

      - name: 上传日志作为产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-log
          path: keepalive.log
          retention-days: 14
